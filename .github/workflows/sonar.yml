# TODO: Provision SonarQube project on sonarqube.home301server.com.br:
#   1. Create project: yolo-labz_kokoro-speakd
#   2. Generate PROJECT_ANALYSIS_TOKEN (scoped to this project key)
#   3. Set repo variable SONAR_HOST_URL = https://sonarqube.home301server.com.br
#   4. Set repo secret SONAR_TOKEN = <the project analysis token>

name: SonarQube scan

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout (full history for blame-based coverage)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skip if SonarQube not configured
        id: check
        env:
          HOST: ${{ vars.SONAR_HOST_URL }}
          TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$HOST" ] || [ -z "$TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SONAR_HOST_URL or SONAR_TOKEN not set — skipping Sonar scan."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install test deps (best-effort, torch optional)
        if: steps.check.outputs.skip == 'false'
        continue-on-error: true
        run: |
          # Hash-pinned: an unpinned 'pip install pytest pytest-cov' (and the
          # pip self-upgrade) meant the post-merge lane silently changed
          # dependency versions with upstream releases.
          python -m pip install --require-hashes -r .github/requirements/sonar-tests.txt || true
      - name: Run tests with coverage (best-effort)
        if: steps.check.outputs.skip == 'false'
        continue-on-error: true
        run: |
          pytest \
            --cov=. \
            --cov-report=xml \
            --junitxml=test-results.xml \
            tests/ || echo "Tests failed or torch unavailable — Sonar will scan lint-only."
      # SonarQube origin hardening (SONAR-ORIGIN, 13/11/2026): every cold scan pulls ~220 MB (scanner JRE,
      # engine, analyzer plugins) from the home-hosted server and the large downloads get cut. Cache them, and
      # install the scanner CLI ourselves with bounded, checksum-pinned downloads so the action never runs its
      # unbounded `gpg --recv-keys` (the keyserver hang that ran into the job timeout).
      # ponytail: sha256 below is the action's own linux-x64 pin for scanner 8.3.1.16491 (sonar-scanner-version at
      # v8.4.1); bump both together with the action.
      - name: Cache scanner JRE, engine and plugins
        if: steps.check.outputs.skip == 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-scanner-${{ runner.os }}-${{ hashFiles('.github/workflows/sonar.yml') }}
          restore-keys: sonar-scanner-${{ runner.os }}-
      - name: Pre-install SonarScanner CLI (bounded, checksum-pinned)
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          v=8.3.1.16491
          sha=0f304e4c5982f0cfbd06762306d6e60e6ed9c8e3853629ae3b8ec2f4dc9bdc04
          dir="$RUNNER_TOOL_CACHE/sonar-scanner-cli/8.3.1-build.16491/linux-x64"
          if [ ! -f "$dir.complete" ]; then
            zip="$RUNNER_TEMP/sonar-scanner-cli.zip"
            curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 150 -o "$zip" \
              "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$v-linux-x64.zip"
            echo "$sha  $zip" | sha256sum -c -
            rm -rf "$RUNNER_TEMP/sonar-unzip" "$dir"
            unzip -q "$zip" -d "$RUNNER_TEMP/sonar-unzip"
            mkdir -p "$dir"
            cp -a "$RUNNER_TEMP/sonar-unzip/sonar-scanner-$v-linux-x64/." "$dir/"
            touch "$dir.complete"
          fi
      - name: SonarQube scan
        id: sonar_try1
        # The server drops large downloads / report uploads under load (Connection reset, SocketTimeout): one retry
        # resumes from what ~/.sonar/cache already holds. A real analysis failure fails the second attempt too.
        continue-on-error: true
        if: steps.check.outputs.skip == 'false'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - name: SonarQube scan (retry after a dropped download)
        if: steps.sonar_try1.outcome == 'failure'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
